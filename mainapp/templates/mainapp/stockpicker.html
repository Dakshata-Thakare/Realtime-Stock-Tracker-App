{% extends 'mainapp/basic.html' %}
{% load static %}
{% block title %}
StockPicker
{% endblock %}
{% block css %}
<style>

</style>
{% endblock %}
{% block body %}
<div class="container">
    <h1>Live Stock Tracker</h1>
    <p>Select Your Favourite Stocks</p>
    <form action="/stocktracker">
        <label for="stockpicker">
            Select Stocks:
        </label>

        <select class="form-select form-select-lg mb-3" multiple name="stockpicker">
            {% for i in stock_picker %}
            <option value="{{ i.symbol }}">
                {{ i.company_name }}
            </option>
            {% endfor %}
        </select>
        <br>
        <div class="d-grid gap-2">
            <input class="btn btn-primary" type="submit" value="Submit">
        </div>
    </form>
</div>
{% endblock %}
